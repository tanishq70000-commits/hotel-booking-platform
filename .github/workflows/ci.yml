name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. LINT & STATIC CODE ANALYSIS
  # =========================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.3 mypy==1.13.0 -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: mypy app scripts

  # =========================================================================
  # 2. AUTOMATED TESTS & CONCURRENCY VALIDATION
  # =========================================================================
  test:
    name: Pytest & Concurrency Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Migrations against Test PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/hotel_test
        run: alembic upgrade head

      - name: Execute Full Test Suite (Unit + Concurrency + Coverage)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/hotel_test
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/hotel_test
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing | tee test-output.txt

      - name: Upload Test Output & Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            coverage.xml
            test-output.txt
          retention-days: 14

  # =========================================================================
  # 3. SECURITY SCANS (Gitleaks, Pip-Audit, Trivy FS)
  # =========================================================================
  security:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Python for Dependency Audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Pip-Audit on Production Requirements
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt || true

      - name: Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  # =========================================================================
  # 4. CONTAINER BUILD, TRIVY IMAGE SCAN & SMOKE TEST
  # =========================================================================
  build:
    name: Docker Build, Image Scan & Smoke Test
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags, Short SHA)
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="sha-${SHA_SHORT}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.sha_short }}
            hotel-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Built Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "hotel-app:test"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: 0

      - name: Smoke Test Deployed Service via Docker Compose
        env:
          IMAGE_TAG: "hotel-app:test"
          POSTGRES_DB: hotel_booking
          POSTGRES_USER: hotel_app_user
          POSTGRES_PASSWORD: test_smoke_password
          PORT_HTTP: "8080"
          PORT_HTTPS: "8443"
        run: |
          sudo systemctl stop apache2 nginx 2>/dev/null || true
          docker compose -f deploy/docker-compose.yml up -d || (docker compose -f deploy/docker-compose.yml logs && exit 1)
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' hotel_app 2>/dev/null || echo "not_found")
            echo "hotel_app status: $STATUS ($i/30)"
            if [ "$STATUS" = '"healthy"' ]; then
              echo "hotel_app is healthy!"
              break
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          echo "=== Testing App Health Endpoint ==="
          docker exec hotel_app curl -s -f http://localhost:8000/health || (docker compose -f deploy/docker-compose.yml logs && exit 1)
          echo "=== Testing App Ready Endpoint ==="
          docker exec hotel_app curl -s -f http://localhost:8000/ready || (docker compose -f deploy/docker-compose.yml logs && exit 1)
          docker compose -f deploy/docker-compose.yml down -v

  # =========================================================================
  # 5. PUBLISH TO GHCR (Only on push to main or version tags)
  # =========================================================================
  publish:
    name: Publish Image to GHCR
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Image to GHCR
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha

      - name: Capture Image Digest & Publish Summary
        run: |
          DIGEST="${{ steps.build_push.outputs.digest }}"
          echo "IMAGE DIGEST: $DIGEST"
          echo "$DIGEST" > image-digest.txt
          echo "### 🚀 Published Image to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`ghcr.io/${{ steps.meta.outputs.repo }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`sha-${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-image-digest
          path: image-digest.txt

