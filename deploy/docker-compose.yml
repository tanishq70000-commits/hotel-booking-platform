services:
  db:
    image: postgres:16-alpine
    container_name: hotel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_booking}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_secure_password_replace_in_prod}
    volumes:
      - hotel_db_data:/var/lib/postgresql/data
    networks:
      - hotel_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-hotel-reservation-api:local}
    container_name: hotel_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-hotel_app_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_secure_password_replace_in_prod}
      DB_NAME: ${POSTGRES_DB:-hotel_booking}
    networks:
      - hotel_internal_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  caddy:
    image: caddy:2.8.4-alpine
    container_name: hotel_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hotel_internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --no-check-certificate https://localhost:443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  hotel_db_data:
    name: hotel_db_data
  caddy_data:
    name: hotel_caddy_data
  caddy_config:
    name: hotel_caddy_config

networks:
  hotel_internal_net:
    name: hotel_internal_net
    driver: bridge

